[project]
name = "academy-python-data-analysis"
version = "0.1.0"
requires-python = ">=3.13,<3.16"
dependencies = [
    "altair>=6.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

# 7-day cooldown for supply-chain security
[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { certifi = "1 day" }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "nbstripout>=0.9.1",
    "ruff>=0.17.3",
]
